<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0a0714"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="50"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="920" cy="180" r="280" fill="#a855f7" opacity="0.28" filter="url(#blur)"/>
  <circle cx="280" cy="640" r="300" fill="#0ea5e9" opacity="0.22" filter="url(#blur)"/>

  <g transform="translate(600 340)" text-anchor="middle" font-family="Inter, system-ui, sans-serif">
    <text y="-140" font-size="18" fill="#94a3b8" letter-spacing="8">GEO · GENERATIVE ENGINE OPTIMIZATION</text>
    <text y="-40" font-size="120" font-weight="800" fill="url(#glow)">GEO SEO Boost</text>
    <text y="30" font-size="30" fill="#cbd5e1">Optimisation pour moteurs de recherche IA</text>
    <text y="80" font-size="24" fill="#64748b">ChatGPT · Claude · Perplexity · Gemini · AI Overviews</text>
  </g>

  <g transform="translate(600 620)" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#94a3b8">
    <g transform="translate(-360 0)">
      <rect x="-90" y="-22" width="180" height="44" rx="22" fill="#1e1b2e" stroke="#3b2f5a"/>
