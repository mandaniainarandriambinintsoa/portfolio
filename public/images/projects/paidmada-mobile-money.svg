<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#071019"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.2" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="240" cy="200" r="260" fill="#10b981" opacity="0.25" filter="url(#blur)"/>
  <circle cx="960" cy="640" r="300" fill="#0ea5e9" opacity="0.22" filter="url(#blur)"/>
  <rect width="1200" height="800" fill="url(#spot)"/>

  <g transform="translate(600 340)" text-anchor="middle" font-family="Inter, system-ui, sans-serif">
    <text y="-140" font-size="18" fill="#94a3b8" letter-spacing="8">MOBILE MONEY · MADAGASCAR</text>
    <text y="-40" font-size="120" font-weight="800" fill="url(#glow)">PaidMada</text>
    <text y="30" font-size="30" fill="#cbd5e1">API de paiement unifiée</text>
    <text y="80" font-size="24" fill="#64748b">MVola · Orange Money · Airtel Money</text>
  </g>

  <g transform="translate(600 620)" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#94a3b8">
    <g transform="translate(-320 0)">
      <rect x="-80" y="-22" width="160" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
      <text y="6">REST API</text>
    </g>
    <g>
      <rect x="-80" y="-22" width="160" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
      <text y="6">TypeScript SDK</text>
    </g>
    <g transform="translate(320 0)">
      <rect x="-80" y="-22" width="160" height="44" rx="22" fill="#1e293b" stroke="#334155"/>
      <text y="6">Webhooks</text>
    </g>
  </g>
</svg>
