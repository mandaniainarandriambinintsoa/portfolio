<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="c">
      <circle cx="50" cy="50" r="44"/>
    </clipPath>
    <linearGradient id="rg" x1="0" y1="0.3" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- White filled circle background -->
  <circle cx="50" cy="50" r="44" fill="white"/>

  <!-- Red bowl shape clipped to circle -->
  <g clip-path="url(#c)">
    <path d="M 4,46 Q 30,28 50,35 Q 70,28 96,46 L 96,100 L 4,100 Z" fill="url(#rg)"/>
  </g>

  <!-- Circle outline -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Curved separator -->
  <path d="M 7,45 Q 30,26 50,33 Q 70,26 93,45" fill="none" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
</svg>
