<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Architecture publique d'une automatisation de prospection B2B</title><desc id="desc">Campagnes, sourcing et qualification, dédoublonnage, recherche et validation humaine.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071b1b"/><stop offset="1" stop-color="#08111f"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-opacity=".28"/></filter></defs>
  <rect width="1200" height="720" fill="url(#bg)"/><g opacity=".16" stroke="#6ee7b7"><path d="M0 90h1200M0 210h1200M0 330h1200M0 450h1200M0 570h1200M100 0v720M300 0v720M500 0v720M700 0v720M900 0v720M1100 0v720"/></g>
  <text x="64" y="82" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="25" font-weight="700">Prospection B2B — architecture publique</text><text x="64" y="113" fill="#9ca3af" font-family="Arial, sans-serif" font-size="15">n8n orchestre les étapes ; les données privées, accès et URLs internes sont retirés.</text>
  <g fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"><path d="M252 318h48"/><path d="M482 318h48"/><path d="M712 318h48"/><path d="M942 318h48"/><path d="M600 417v70"/></g><g fill="#34d399"><path d="m292 311 14 7-14 7z"/><path d="m522 311 14 7-14 7z"/><path d="m752 311 14 7-14 7z"/><path d="m982 311 14 7-14 7z"/><path d="m593 478 7 14 7-14z"/></g>
  <g filter="url(#shadow)" font-family="Arial, sans-serif"><g><rect x="64" y="250" width="188" height="136" rx="18" fill="#0e302e" stroke="#2dd4bf"/><text x="88" y="296" fill="#99f6e4" font-size="13" font-weight="700">01 · CAMPAGNES</text><text x="88" y="330" fill="white" font-size="19" font-weight="700">Segments actifs</text><text x="88" y="356" fill="#a7b7bd" font-size="14">Quotas et critères</text></g><g><rect x="300" y="250" width="182" height="136" rx="18" fill="#0e302e" stroke="#2dd4bf"/><text x="324" y="296" fill="#99f6e4" font-size="13" font-weight="700">02 · SOURCING</text><text x="324" y="330" fill="white" font-size="19" font-weight="700">Entreprises</text><text x="324" y="356" fill="#a7b7bd" font-size="14">Recherche et classement</text></g><g><rect x="530" y="250" width="182" height="136" rx="18" fill="#163454" stroke="#60a5fa"/><text x="554" y="296" fill="#bfdbfe" font-size="13" font-weight="700">03 · CONTRÔLE</text><text x="554" y="330" fill="white" font-size="19" font-weight="700">Anti-doublon</text><text x="554" y="356" fill="#b7c7d8" font-size="14">Comptes jamais vus</text></g><g><rect x="760" y="250" width="182" height="136" rx="18" fill="#163454" stroke="#60a5fa"/><text x="784" y="296" fill="#bfdbfe" font-size="13" font-weight="700">04 · QUALIFICATION</text><text x="784" y="330" fill="white" font-size="19" font-weight="700">Décideurs</text><text x="784" y="356" fill="#b7c7d8" font-size="14">Rôles et garde-fous</text></g><g><rect x="990" y="250" width="164" height="136" rx="18" fill="#3b2749" stroke="#c084fc"/><text x="1014" y="296" fill="#e9d5ff" font-size="13" font-weight="700">05 · RECHERCHE</text><text x="1014" y="330" fill="white" font-size="19" font-weight="700">Signal public</text><text x="1014" y="356" fill="#d5c4dd" font-size="14">Message préparé</text></g><g><rect x="440" y="492" width="320" height="138" rx="18" fill="#173e2d" stroke="#4ade80" stroke-width="2"/><text x="470" y="540" fill="#bbf7d0" font-size="13" font-weight="700">06 · VALIDATION HUMAINE</text><text x="470" y="575" fill="white" font-size="21" font-weight="700">File de revue</text><text x="470" y="604" fill="#c1d6cb" font-size="15">Aucun envoi automatique au prospect</text></g></g>
</svg>
